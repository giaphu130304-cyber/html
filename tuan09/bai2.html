<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách Tour</title><link rel="stylesheet" href="../assets/style.css">
<style>#m{display:none;position:fixed;inset:0;background:#0008;padding:16px;overflow:auto}#m.on{display:block}#b{background:var(--bg);max-width:480px;margin:auto;padding:16px;border-radius:8px}</style></head><body><div style="background:linear-gradient(135deg,#0b5,#07a);color:#fff;padding:24px;text-align:center;border-radius:8px;margin-bottom:8px"><b>VIETNAM SILKROAD TRAVEL</b></div>
<h2>DANH SÁCH TOUR – DU LỊCH VIỆT</h2><p><a href="#">Đăng nhập</a> · <a href="#" id="open">Mở tour mới</a></p>
<table><thead><tr><th>STT</th><th>Mã Tour</th><th>Hành trình</th><th>Khởi hành</th><th>Thời gian</th><th>Giá</th><th>Ảnh</th></tr></thead><tbody id="t"></tbody></table>
<div id="m"><div id="b"><h3>THÔNG TIN TOUR</h3><form id="f" novalidate></form></div></div><p><a href="../index.html">← Trang chủ</a></p>
<script>
const F=[["ma","Mã tour","text",v=>/^[A-Z]{3}-[A-Z]{3}-(0[1-9]|1[0-2])-\d{4}$/.test(v)&&(!nk.value||v.slice(8)==nk.value.slice(5,7)+"-"+nk.value.slice(0,4)),"Mẫu XXX-XXX-mm-yyyy, mm-yyyy phải khớp ngày khởi hành"],
["ht","Hành trình","text",v=>v.trim()!=="","Bắt buộc nhập"],
["nk","Ngày khởi hành","date",v=>v&&new Date(v)>new Date(Date.now()+30*864e5),"Phải sau ngày hiện tại 30 ngày"],
["tg","Thời gian","text",v=>v.trim()!=="","Bắt buộc nhập"],
["gt","Giá tour","number",v=>+v>0,"Giá phải là số > 0"],
["im","Ảnh đại diện","file",v=>/\.(jpg|gif|png)$/i.test(v),"Chỉ nhận jpg, gif, png"]];
const rows=[["HNI-HCM-08-2018","Hà Nội - Hồ Chí Minh 4 ngày 3 đêm","2018-06-08","4 ngày 3 đêm",9500000,"HCM.jpg"],["HNI-DNG-08-2018","Hà Nội - Huế - Đà Nẵng 5 ngày 4 đêm","2018-06-08","5 ngày 4 đêm",10500000,"Hue.jpg"]];
const draw=()=>t.innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("");draw();
f.innerHTML=F.map(([i,l,t])=>`<label>${l} (*)</label><input id="${i}" type="${t}"><span class="err" id="e_${i}"></span>`).join("")+'<p><button>Lưu</button></p>';
open.onclick=e=>{e.preventDefault();m.classList.add("on")};m.onclick=e=>{if(e.target==m)m.classList.remove("on")};
f.onsubmit=e=>{e.preventDefault();let bad=false;F.forEach(([i,,,ok,msg])=>{const g=ok(document.getElementById(i).value);document.getElementById("e_"+i).textContent=g?"":"(*) "+msg;if(!g)bad=true});
if(bad)return;rows.push(F.map(([i])=>i=="im"?"<img src='"+URL.createObjectURL(document.getElementById(i).files[0])+"' height=30>":document.getElementById(i).value));draw();f.reset();m.classList.remove("on")};
</script></body></html>
