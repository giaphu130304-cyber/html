<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jackson Electronics - Registration Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        font-size: 13px;
        background-color: #a9dede;
        margin: 0;
    }
    .page {
        max-width: 520px;
        margin: 0 auto;
        background-color: #a9dede;
        padding: 20px 30px 30px 30px;
    }
    .banner {
        background-color: #00e5e5;
        border: 3px solid #000;
        text-align: center;
        padding: 10px;
        margin-bottom: 15px;
    }
    .banner h1 {
        margin: 0;
        font-family: "Brush Script MT", cursive;
        font-size: 34px;
    }
    h2 {
        text-align: center;
        margin: 10px 0 5px 0;
    }
    .subtitle {
        text-align: center;
        margin-bottom: 20px;
        font-size: 12px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    td {
        padding: 4px 6px;
        vertical-align: middle;
    }
    .label {
        text-align: right;
        white-space: nowrap;
    }
    input[type="text"], input[type="date"], select {
        padding: 3px;
        width: 100%;
        box-sizing: border-box;
    }
    hr {
        border: none;
        border-top: 1px solid #333;
        margin: 15px 0;
    }
    textarea {
        width: 100%;
        box-sizing: border-box;
    }
    .buttons {
        text-align: center;
        margin-top: 15px;
    }
</style>
</head>
<body>
<div class="page">

    <div class="banner">
        <h1>Jackson Electronics</h1>
    </div>

    <h2>Registration Form</h2>
    <p class="subtitle">Register your Jackson Electronics product here</p>

    <form action="#" method="post">
        <table>
            <tr>
                <td class="label">First Name:</td>
                <td><input type="text" name="firstname"></td>
                <td class="label">Last Name:</td>
                <td><input type="text" name="lastname"></td>
            </tr>
            <tr>
                <td class="label">Address #1:</td>
                <td colspan="3"><input type="text" name="address1"></td>
            </tr>
            <tr>
                <td class="label">Address #2:</td>
                <td colspan="3"><input type="text" name="address2"></td>
            </tr>
            <tr>
                <td class="label">City:</td>
                <td><input type="text" name="city"></td>
                <td class="label">State:</td>
                <td><input type="text" name="state" style="width: 40px;">
                    &nbsp;Zip: <input type="text" name="zip" style="width: 60px;"></td>
            </tr>
            <tr>
                <td class="label">Country:</td>
                <td colspan="3"><input type="text" name="country" value="United States"></td>
            </tr>
        </table>

        <hr>

        <table>
            <tr>
                <td class="label">Product:</td>
                <td colspan="3">
                    <select name="product">
                        <option>ScanMaster</option>
                        <option>PrintMaster</option>
                        <option>CopyMaster</option>
                        <option>FaxMaster</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">Date Purchased:</td>
                <td colspan="3"><input type="text" name="datepurchased"></td>
            </tr>
            <tr>
                <td class="label">Serial #:</td>
                <td colspan="3"><input type="text" name="serial"></td>
            </tr>
            <tr>
                <td class="label">Used for:</td>
                <td>
                    <input type="radio" name="usedfor" id="home"> <label for="home">Home</label><br>
                    <input type="radio" name="usedfor" id="business" checked> <label for="business">Business</label><br>
                    <input type="radio" name="usedfor" id="government"> <label for="government">Government</label>
                </td>
                <td colspan="2">
                    <input type="radio" name="usedfor" id="edu"> <label for="edu">Educational Institution</label><br>
                    <input type="radio" name="usedfor" id="other"> <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td class="label">System (check all that apply):</td>
                <td>
                    <input type="checkbox" name="sys" id="windows"> <label for="windows">Windows</label><br>
                    <input type="checkbox" name="sys" id="mac"> <label for="mac">Macintosh</label>
                </td>
                <td colspan="2">
                    <input type="checkbox" name="sys" id="unix"> <label for="unix">UNIX</label><br>
                    <input type="checkbox" name="sys" id="othersys"> <label for="othersys">Other</label>
                </td>
            </tr>
        </table>

        <hr>

        <table>
            <tr>
                <td class="label" style="vertical-align: top;">Comments?:</td>
                <td colspan="3"><textarea name="comments" rows="4"></textarea></td>
            </tr>
        </table>

        <div class="buttons">
            <input type="submit" value="Click to register">
            <input type="reset" value="Click to cancel">
        </div>
    </form>

</div>
</body>
</html>
