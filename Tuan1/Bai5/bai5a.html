<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Classic Movie Day</title>
<style>
    table {
        border-collapse: collapse;
        width: 500px;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }
    caption {
        font-weight: bold;
        padding: 6px;
        background-color: #f2f2f2;
        border: 1px solid #999;
        border-bottom: none;
    }
    th, td {
        border: 1px solid #999;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f9f9f9;
    }
</style>
</head>
<body>

<table>
    <caption>Classic Movie Day</caption>
    <tr>
        <th>&nbsp;</th>
        <th>5 pm</th>
        <th>7 pm</th>
        <th>9 pm</th>
        <th>11 pm</th>
    </tr>
    <tr>
        <th>Screen one</th>
        <td>Star Wars</td>
        <td>Empire Strikes Back</td>
        <td>Return of the Jedi</td>
        <td>The Exorcist</td>
    </tr>
    <tr>
        <th>Screen two</th>
        <td colspan="2">Dances with Wolves</td>
        <td colspan="2">Gone With the Wind</td>
    </tr>
    <tr>
        <th>Screen three</th>
        <td colspan="2">2001: A Space Odyssey</td>
        <td>The Conversation</td>
        <td>5 Easy Pieces</td>
    </tr>
</table>

</body>
</html>
