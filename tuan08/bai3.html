<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form nhập bảng</title><link rel="stylesheet" href="../assets/style.css"></head><body><h3>Đăng ký môn học</h3><label>Họ tên</label><input id=n><span class=err id=e></span><label>Lớp</label><select id=l><option>Đại học Kỹ thuật phần mềm 9A<option>Đại học Khoa học máy tính 18C</select><label>Môn học</label><select id=m><option>Lập trình hướng đối tượng<option>Hệ thống và công nghệ web</select><label>Loại</label><label style=font-weight:400><input type=radio name=k value="Lý thuyết" checked style=width:auto> Lý thuyết <input type=radio name=k value="Thực hành" style=width:auto> Thực hành</label><p><button id=b disabled>Đăng ký</button></p><table id=t><tr><th>Họ tên</th><th>Lớp</th><th>Môn học đăng ký</th><th>Loại</th></tr></table><script>const ok=v=>v.trim()!==""&&/^([A-ZÀ-Ỵ][a-zà-ỹ]*)(\s[A-ZÀ-Ỵ][a-zà-ỹ]*)*$/.test(v.trim());n.focus();n.oninput=()=>{const g=ok(n.value);e.textContent=g?"":"(*) Bắt buộc nhập, chữ hoa đầu mỗi từ";b.disabled=!g};b.onclick=()=>{t.insertRow().innerHTML=[n.value,l.value,m.value,document.querySelector("[name=k]:checked").value].map(c=>"<td>"+c+"</td>").join("");n.value="";b.disabled=true}</script><p><a href="../index.html">← Trang chủ</a></p></body></html>
