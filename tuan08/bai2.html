<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hoa</title><link rel="stylesheet" href="../assets/style.css"><style>td.i{font-size:42px;text-align:center}</style></head><body><table><tr><th>STT<th>Hình ảnh<th>Giá<th>Số lượng</tr><tbody id=b></tbody><tr><td><td><td>Tổng thành tiền<td id=tong></table><p><a href="../index.html">← Trang chủ</a></p><script>const P=[[20000,20,"💐"],[40000,5,"🌹"],[30000,0,"🌷"],[50000,0,"🌺"],[30000,0,"🌸"]];
b.innerHTML=P.map(([g,q,i],k)=>`<tr><td>${k+1}<td class=i>${i}<td>${g}<td><input type=number min=0 value=${q}>`).join("");
const sum=()=>{let s=0;b.querySelectorAll("tr").forEach((r,k)=>s+=P[k][0]*(+r.querySelector("input").value||0));tong.textContent=s};b.oninput=sum;sum()</script></body></html>
