<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook – Đăng ký</title><link rel="stylesheet" href="../assets/style.css"><style></style></head><body><div style="background:#3b5998;color:#fff;padding:10px;font:bold 24px sans-serif;margin:-16px -16px 16px">facebook</div><h2>Đăng ký</h2><p><b>Miễn phí và sẽ luôn như vậy.</b></p><form id=f novalidate></form><p id=res class=ok></p><p><a href="../index.html">← Trang chủ</a></p><script>const cap=v=>/^[A-ZÀ-Ỵ]/.test(v.trim());
const F=[["ho","Họ",v=>cap(v),"Bắt buộc, viết hoa chữ cái đầu"],["ten","Tên",v=>cap(v),"Bắt buộc, viết hoa chữ cái đầu"],["em","Email đăng nhập",v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),"Email không đúng định dạng"],["em2","Nhập lại Email",v=>v!==""&&v===em.value,"Phải trùng với email đã nhập"],["mk","Mật khẩu",v=>/^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(v),"Có chữ, số và ít nhất 6 ký tự"],["ns","Năm sinh",v=>/^\d{4}$/.test(v)&&+v<2002,"Năm sinh phải < 2002"]];
f.innerHTML=F.map(([i,l])=>`<input id=${i} placeholder="${l}" type=${i=="mk"?"password":"text"}><span class=err id=e_${i}></span>`).join("")+"<p><button style=background:#42b72a>Đăng ký</button></p>";
f.onsubmit=e=>{e.preventDefault();let bad=0;F.forEach(([i,,ok,m])=>{const g=ok(document.getElementById(i).value);document.getElementById("e_"+i).textContent=g?"":"(*) "+m;if(!g)bad=1});res.textContent=bad?"":"Đăng ký thành công!"}</script></body></html>
