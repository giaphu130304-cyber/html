<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký tài khoản</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<h2>ĐĂNG KÝ TÀI KHOẢN</h2><form id="f" novalidate></form><p id="res" class="ok"></p><p><a href="../index.html">← Trang chủ</a></p>
<script>
const F=[["dn","Tên đăng nhập","text",v=>/^[A-Za-z][^\s]*$/.test(v),"Bắt đầu bằng chữ cái, không có khoảng trắng"],
["mk","Mật khẩu","password",v=>/^(?=.*\d)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}$/.test(v),"≥8 ký tự, có số, chữ hoa và ký tự đặc biệt"],
["xn","Nhập lại mật khẩu","password",v=>v===mk.value,"Phải giống mật khẩu"],
["hv","Họ và tên","text",v=>/^([A-ZÀ-Ỵ][a-zà-ỹ]*)(\s[A-ZÀ-Ỵ][a-zà-ỹ]*)+$/.test(v.trim()),"Ít nhất họ và tên, chữ cái đầu viết hoa"],
["ns","Ngày sinh","date",v=>v&&(Date.now()-new Date(v))/31557600000>16,"Phải trên 16 tuổi"],
["dc","Địa chỉ","text",v=>v.trim()!=="","Không được để trống"],
["dt","Điện thoại","text",v=>/^(09|03|07|06|05|04)\d{8}$/.test(v),"10 số, bắt đầu 09/03/07/06/05/04"],
["em","Email","text",v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),"Email không đúng định dạng"]];
f.innerHTML=F.map(([i,l,t])=>`<label>${l} (*)</label><input id="${i}" type="${t}"><span class="err" id="e_${i}"></span>`).join("")+'<p><button>Đăng ký</button> <button type="reset" style="background:#6b7280">Hủy</button></p>';
f.onsubmit=e=>{e.preventDefault();let first=null;F.forEach(([i,,,ok,m])=>{const good=ok(document.getElementById(i).value);document.getElementById("e_"+i).textContent=good?"":"(*) "+m;if(!good&&!first)first=i});
if(first)document.getElementById(first).focus();res.textContent=first?"":"Đăng ký thành công!"};
</script></body></html>
