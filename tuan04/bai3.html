<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bootstrap Modal</title><link rel="stylesheet" href="../assets/bootstrap.css"><style></style></head><body><div class=container><button class="btn btn-primary mt-3" data-o="#m">Login / Đăng ký</button></div><div class=modal id=m><div class=modal-dialog><div class=modal-content><div class=modal-header><h5 class=modal-title><a href=# id=t1>ĐĂNG NHẬP</a> / <a href=# id=t2 class=text-muted>ĐĂNG KÝ</a></h5><button class=close data-x>×</button></div><div class=modal-body><form id=p1><input class="form-control mb-2" placeholder=Email><input type=password class="form-control mb-2" placeholder="Mật khẩu"><button class="btn btn-block" style=background:#f36c3a;color:#fff>ĐĂNG NHẬP</button></form><form id=p2 style=display:none><input class="form-control mb-2" placeholder="Họ tên"><input class="form-control mb-2" placeholder=Email><input type=password class="form-control mb-2" placeholder="Mật khẩu"><button class="btn btn-block" style=background:#f36c3a;color:#fff>ĐĂNG KÝ</button></form></div></div></div></div><p class=container><a href=../index.html>← Trang chủ</a></p><script>document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>document.querySelector(b.dataset.t).classList.toggle("show"));document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const m=document.querySelector(b.dataset.o);m.style.display="block";m.classList.add("show")});document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const m=b.closest(".modal");m.style.display="none";m.classList.remove("show")})</script><script>const s=a=>{p1.style.display=a?"":"none";p2.style.display=a?"none":"";t1.className=a?"":"text-muted";t2.className=a?"text-muted":""};t1.onclick=e=>{e.preventDefault();s(1)};t2.onclick=e=>{e.preventDefault();s(0)}</script></body></html>
