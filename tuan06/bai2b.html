<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phép tính cơ bản</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<h2>PHÉP TÍNH CƠ BẢN</h2>
<label>Nhập số thứ 1 <span class="err" id="e1"></span></label><input id="a">
<label>Nhập số thứ 2 <span class="err" id="e2"></span></label><input id="b"><p>
<button onclick="calc('+')">Cộng</button> <button onclick="calc('-')">Trừ</button> <button onclick="calc('*')">Nhân</button> <button onclick="calc('/')">Chia</button> <button onclick="calc('%')">Chia dư</button></p>
<label>Kết quả</label><input id="r" readonly><p><a href="../index.html">← Trang chủ</a></p>
<script>
function calc(op){const a=document.getElementById("a").value.trim(),b=document.getElementById("b").value.trim();
const bad=v=>v===""||isNaN(v);e1.textContent=bad(a)?"(*) Phải là số":"";e2.textContent=bad(b)?"(*) Phải là số":"";
if(bad(a)||bad(b))return;const x=+a,y=+b;if((op=="/"||op=="%")&&y==0){e2.textContent="(*) Số chia phải khác 0";return}
r.value={"+":x+y,"-":x-y,"*":x*y,"/":x/y,"%":x%y}[op]}
</script></body></html>
