<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chọn cafe</title><link rel="stylesheet" href="../assets/style.css"><style></style></head><body><div style="border:1px solid var(--bd);padding:12px;max-width:300px">Chọn loại cafe :<div id=l></div><button onclick=pick()>Chọn</button><p>Bạn chọn cafe: <span id=r style=color:red></span></p></div><p><a href="../index.html">← Trang chủ</a></p><script>const C=["Trung Nguyen","Me Kong","New life","Ocean Blue","Blue Space","Windows"];l.innerHTML=C.map(c=>`<label style="font-weight:400;margin:0"><input type=checkbox style=width:auto value="${c}"> ${c}</label>`).join("");function pick(){r.textContent=[...l.querySelectorAll(":checked")].map(c=>c.value).join(", ")}</script></body></html>
