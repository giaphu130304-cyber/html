<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form định dạng</title><link rel="stylesheet" href="../assets/style.css"><style></style></head><body><h3 align=center>FORM ĐỊNH DẠNG</h3><div style="max-width:420px;border:1px solid #6af;padding:12px"><label>Họ và tên</label><input id=n><label>Chọn</label><label style=font-weight:400><input type=radio name=k value=bg style=width:auto checked> Background</label><label style=font-weight:400><input type=radio name=k value=ft style=width:auto> Font</label><label>Chọn màu</label><select id=c><option value="">Chọn màu ...<option value=red>Đỏ<option value=blue>Xanh dương<option value=green>Xanh lá<option value=yellow>Vàng</select><p><button onclick=ap()>Đổi màu</button> <button onclick=cl()>Cancel</button></p><p id=t>you can direct link the hyperlink with the file if you know the address but this is limited by the browser. A good solution would be to have a separate page for downloading files.</p></div><p><a href="../index.html">← Trang chủ</a></p><script>function ap(){const k=document.querySelector("[name=k]:checked").value;if(k=="bg")t.style.background=c.value;else t.style.color=c.value}function cl(){t.style.background="";t.style.color="";c.value="";n.value=""}</script></body></html>
