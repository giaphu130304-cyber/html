<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin đăng ký</title><link rel="stylesheet" href="../assets/style.css"><style></style></head><body><h2 align=center>THÔNG TIN ĐĂNG KÝ</h2><table><tr><td>Họ tên<td><input id=u><tr><td>Mật khẩu<td><input id=p type=password><tr><td><td><button onclick=go()>Nhập</button></table><p class=err id=e></p><p><a href=dangnhap.html>Đến trang đăng nhập</a></p><p><a href="../index.html">← Trang chủ</a></p><script>function go(){if(!u.value||!p.value){e.textContent="(*) Nhập đủ họ tên và mật khẩu";return}try{localStorage.setItem("u",u.value);localStorage.setItem("p",p.value)}catch(x){}location="dangnhap.html"}</script></body></html>
