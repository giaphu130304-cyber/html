<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-SPEED COMPANY</title><link rel="stylesheet" href="../assets/style.css"><style>.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}@media(max-width:600px){.g{grid-template-columns:1fr}}h4{margin:6px 0}</style></head><body><img src=../tuan06/images/banner_car.jpg style=width:100%;max-height:140px;object-fit:cover><div class=g><div><b>Bảng tin thị trường</b><h4>Vàng</h4><table><tr><th>Mua vào<th>Bán ra<tr><td id=gm>&nbsp;<td id=gb></table><h4>USD</h4><table><tr><th>Mua vào<th>Bán ra<tr><td id=um>&nbsp;<td id=ub></table></div><div><b>Cập nhật giá cả thị trường</b><label>Mua vào</label><input id=mv><span class=err id=e></span><label>Bán ra</label><input id=br><label>Loại xe</label><select id=lx><option value="../tuan06/images/car1.jpg;35000">Toyota<option value="../tuan06/images/car2.jpg;15000">KIA<option value="../tuan06/images/car3.jpg;40000">Ford<option value="../tuan06/images/car4.jpg;32000">Civic<option value="../tuan06/images/car5.jpg;50000">Ferrari<option value="../tuan06/images/car7.jpg;45000">Mercedes</select><p><label style=font-weight:400><input type=radio name=cn value=1 style=width:auto> Vàng</label> <label style=font-weight:400><input type=radio name=cn value=0 style=width:auto> USD</label></p><button id=up>Update</button> <button id=st disabled>State</button></div><div><b>Bảng báo giá</b><br><img id=im src=../tuan06/images/car1.jpg width=100%><p id=gia>Giá: 35000 USD</p></div></div><p><a href="../index.html">← Trang chủ</a></p><script src="../assets/jquery.min.js"></script><script>$(function(){$("#mv").focus();$("#mv").blur(function(){const v=$(this).val().trim();const ok=v!==""&&!isNaN(v);$("#e").text(v===""||ok?"":"(*) Phải là số");$("#st").prop("disabled",!ok)});
$("#lx").on("click change",function(){const p=this.value.split(";");$("#im").attr("src",p[0]);$("#gia").text("Giá: "+p[1]+" USD")});
$("#up").click(function(){const k=$("[name=cn]:checked").val();if(k===undefined)return;const a=k==="1"?["#gm","#gb"]:["#um","#ub"];$(a[0]).html($("#mv").val());$(a[1]).html($("#br").val())})})</script></body></html>
