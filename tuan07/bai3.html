<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Form</title><link rel="stylesheet" href="../assets/style.css"><style></style></head><body><h3 align=center>Register Form</h3><form id=f novalidate><div id=fl></div><label>Ngày sinh</label><span style=display:flex;gap:6px><select id=d></select><select id=m></select><select id=y></select></span><label>Sở thích</label><select id=st><option>Ca Nhạc<option>Thể thao<option>Đọc sách</select><p><button>Đăng Ký</button> <button type=reset style=background:#6b7280>Hủy</button></p></form><p><a href="../index.html">← Trang chủ</a></p><script>const F=[["hv","Họ và tên",1,v=>v.trim()!=="","Bắt buộc nhập"],["tk","Tên đăng nhập",1,v=>v.length>=6,"Ít nhất 6 ký tự"],["mk","Mật khẩu",1,v=>v!=="","Bắt buộc nhập"],["xn","Xác nhận mật khẩu",1,v=>v!==""&&v===mk.value,"Phải giống mật khẩu"],["dt","Điện thoại",0,v=>v===""||/^\d+$/.test(v),"Phải là số"],["dc","Địa chỉ",0,()=>true,""],["em","Email khác",0,v=>v===""||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),"Email không đúng mẫu"]];
fl.innerHTML=F.map(([i,l,r])=>`<label>${l}${r?" (*)":""}</label><input id=${i} type=${i.match(/mk|xn/)?"password":"text"}><span class=err id=e_${i}></span>`).join("");
const o=(s,a,b)=>{for(let i=a;i<=b;i++)s.add(new Option(i,i))};o(d,1,31);o(m,1,12);o(y,1940,2010);
f.onsubmit=e=>{e.preventDefault();let first=null;F.forEach(([i,,,ok,msg])=>{const g=ok(document.getElementById(i).value);document.getElementById("e_"+i).textContent=g?"":"(*) "+msg;if(!g&&!first)first=i});if(first){document.getElementById(first).focus();return}
const data={"Họ và tên":hv.value,"Tên đăng nhập":tk.value,"Ngày sinh":d.value+"/"+m.value+"/"+y.value,"Điện thoại":dt.value,"Địa chỉ":dc.value,"Email":em.value,"Sở thích":st.value};try{sessionStorage.setItem("tt",JSON.stringify(data))}catch(x){}location="thongtin.html"}</script></body></html>
